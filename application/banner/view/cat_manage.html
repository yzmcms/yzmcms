<?php include $this->admin_tpl('footer','admin');?>
<script>
	$(function(){
		// 双击编辑分类名称
		$('td.cat_name').dblclick(function(){
			$(this).html('<input type="text" class="input-text" value="'+yzm_htmlspecialchars($(this).text())+'" />').find('input').focus();
		});

		// 鼠标失去焦点修改分类名称
		$('td.cat_name').on('blur', 'input', function(){
			var this_obj = $(this);
			var tid = this_obj.parent().data('tid');
			var tname = this_obj.val().trim();
			this_obj.parent().text(tname);
			if(!tid || !tname) return;
			$.ajax({
				url: '<?php echo U('cat_edit');?>',
				type: 'post',
				data: {'tid':tid, 'tname':tname, 'yzm_csrf_token':yzm_csrf_token},
				success: function(data){
					if(data.status == 1){
						layer.msg(data.message, {icon:1, time:1000}, function(){
							parent.location.reload();
						});
					}else if(data.status == 0){
						layer.msg(data.message, {icon:2, time:2000});
					}
				}
			});
		});
	});
</script>
</body>
</html>
