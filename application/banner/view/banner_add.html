<script type="text/javascript" src="<?php echo STATIC_URL;?>plugin/laydate/1.1/laydate.js"></script>
<script type="text/javascript">
	var start = {elem:'#start',format:'YYYY-MM-DD hh:mm:ss',min:'1999-01-01',max:'2099-01-01',istime:true,istoday:false,choose:function(datas){end.min = datas;end.start = datas}
	};
	var end = {elem:'#end',format:'YYYY-MM-DD hh:mm:ss',min:'1999-01-01',max:'2099-01-01',istime:true,istoday:false,choose:function(datas){start.max = datas;}};
	laydate(start);
	laydate(end);
	function checkall(obj){
			if(obj.title.value == ''){
				layer.msg('标题名称不能为空！');
				return false;
			}
			if(obj.image.value == ''){
				layer.msg('请上传轮播图！');
				return false;
			}
			if(obj.start_time.value != '' && obj.end_time.value == ''){
				layer.msg('请选择结束时间！');
				return false;
			}
			if(obj.end_time.value != '' && obj.start_time.value == ''){
				layer.msg('请选择开始时间！');
				return false;
			}
			$.ajax({
	            type: "POST",
	            url: "<?php echo U('add');?>", 
	            data: $(obj).serialize(),
			    dataType: "json", 
	            success: function (msg) {
					if(msg.status == 1){
						layer.msg(msg.message, {icon:1, time:800}, function(){
							parent.location.reload();
						});
				    }else{
						layer.msg(msg.message, {icon:2});
					}
	            }
	        })		 
			return false;
	}
</script>
</body>
